server:
  address: 127.0.0.1
  port: ${INTERVIEW_PORT:18082}

spring:
  application:
    name: repoq-interview
  datasource:
    url: ${INTERVIEW_DB_URL:jdbc:postgresql://127.0.0.1:15432/devfield_dev?currentSchema=interview}
    username: ${INTERVIEW_DB_USER:devfield_interview}
    password: ${INTERVIEW_DB_PASSWORD}
  flyway:
    enabled: true
    default-schema: interview
    schemas: interview
    locations: classpath:db/interview

devfield:
  interview:
    auth:
      issuer: ${INTERVIEW_AUTH_ISSUER:}
      audience: ${INTERVIEW_AUTH_AUDIENCE:}
      jwks-uri: ${INTERVIEW_AUTH_JWKS_URI:}
      session-check-uri: ${INTERVIEW_AUTH_SESSION_CHECK_URI:}
      service-key: ${INTERVIEW_AUTH_SERVICE_KEY:}
    ollama-long-timeout: ${INTERVIEW_OLLAMA_LONG_TIMEOUT:${devfield.interview.first-question.ollama-timeout}}
    sessions:
      enabled: ${INTERVIEW_SESSIONS_ENABLED:false}
    first-question:
      fake-enabled: ${INTERVIEW_FIRST_QUESTION_FAKE_ENABLED:false}
      ollama-enabled: ${INTERVIEW_FIRST_QUESTION_OLLAMA_ENABLED:false}
      ollama-port: ${INTERVIEW_FIRST_QUESTION_OLLAMA_PORT:11434}
      ollama-timeout: ${INTERVIEW_FIRST_QUESTION_OLLAMA_TIMEOUT:PT20S}
    follow-up:
      enabled: ${INTERVIEW_FOLLOW_UP_ENABLED:false}
    evaluation:
      enabled: ${INTERVIEW_EVALUATION_ENABLED:false}
    next-bundle:
      enabled: ${INTERVIEW_NEXT_BUNDLE_ENABLED:false}
    lifecycle:
      enabled: ${INTERVIEW_LIFECYCLE_ENABLED:false}
    session-deletion:
      enabled: ${INTERVIEW_SESSION_DELETION_ENABLED:false}
    history:
      enabled: ${INTERVIEW_HISTORY_ENABLED:false}
    mock:
      enabled: ${INTERVIEW_MOCK_ENABLED:false}
    deletion:
      # Incoming X-02 and X-04 use distinct keys over protected service transport.
      project-key-sha256: ${INTERVIEW_X02_PROJECT_KEY_SHA256:}
      auth-key-sha256: ${INTERVIEW_X04_AUTH_KEY_SHA256:}
    project:
      base-url: ${INTERVIEW_PROJECT_BASE_URL:}
      service-key: ${INTERVIEW_PROJECT_X01_SERVICE_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
